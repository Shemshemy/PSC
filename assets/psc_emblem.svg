<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pscGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <radialGradient id="pscBk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="85%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
    <!-- Text paths for circular text -->
    <path id="textCircleTop" d="M 32,120 A 88,88 0 0,1 208,120" fill="none" />
    <path id="textCircleBottom" d="M 208,120 A 88,88 0 0,1 32,120" fill="none" />
  </defs>

  <!-- Outer Shadow & Gold Border -->
  <circle cx="120" cy="120" r="114" fill="#FFFFFF" stroke="url(#pscGoldRing)" stroke-width="6" />
  <circle cx="120" cy="120" r="106" fill="url(#pscBk)" stroke="#92400E" stroke-width="2" />

  <!-- Outer Gold Ring Rim -->
  <circle cx="120" cy="120" r="82" fill="#FFFFFF" stroke="#92400E" stroke-width="1.5" />

  <!-- Circular Outer Text -->
  <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="11.5" fill="#78350F" letter-spacing="2">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      PUBLIC SERVICE COMMISSION
    </textPath>
  </text>
  <text font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="11.5" fill="#78350F" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ KENYA ★
    </textPath>
  </text>

  <!-- Inner Dynamic Figure (Citizen Service & Growth) -->
  <g id="center-figure">
    <!-- Center Head (Citizen / Person) -->
    <circle cx="120" cy="85" r="13" fill="#0F172A" />

    <!-- Uplifting Wings / Hands of Public Service -->
    <!-- Black Ribbon -->
    <path d="M 85,152 C 95,120 105,95 120,95 C 135,95 145,120 155,152 C 145,145 130,135 120,135 C 110,135 95,145 85,152 Z" fill="#0F172A" />

    <!-- Red Ribbon (Kenyan Flag color) -->
    <path d="M 75,165 C 90,135 105,115 120,115 C 135,115 150,135 165,165 C 150,152 135,145 120,145 C 105,145 90,152 75,165 Z" fill="#DC2626" />

    <!-- Green Ribbon (Kenyan Flag color) -->
    <path d="M 68,178 C 88,150 104,132 120,132 C 136,132 152,150 172,178 C 154,162 138,156 120,156 C 102,156 86,162 68,178 Z" fill="#047857" />

    <!-- Core Cross Arc -->
    <path d="M 72,120 C 105,130 135,155 148,180 C 135,175 105,155 72,120 Z" fill="#1E293B" opacity="0.9" />
    <path d="M 168,120 C 135,130 105,155 92,180 C 105,175 135,155 168,120 Z" fill="#1E293B" opacity="0.9" />
  </g>

  <!-- Inner Motto Ribbon -->
  <g id="inner-motto">
    <text x="120" y="196" font-family="'Inter', sans-serif" font-weight="700" font-size="6.5" fill="#451A03" text-anchor="middle" letter-spacing="1">PUBLIC SERVICE COMMITMENT</text>
  </g>
</svg>
