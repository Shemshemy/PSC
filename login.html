<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Candidate Recruitment Portal</title>
  <meta name="description" content="Candidate Recruitment Portal Sign In.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/psc_logo.png">
  <link rel="apple-touch-icon" href="assets/images/psc_logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            civic: {
              forest: '#0B3B24',
              forestHover: '#072517',
              gold: '#C88A19',
              goldLight: '#FEF3C7',
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-100 selection:text-amber-900">

  <!-- Top Accent Stripe -->
  <div class="h-1.5 w-full bg-gradient-to-r from-[#0B3B24] via-[#C88A19] to-[#0B3B24] shrink-0"></div>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 sm:py-12">
    <div class="w-full max-w-md">

      <!-- Login Card -->
      <div class="bg-white rounded-2xl border border-slate-200/90 shadow-xl p-6 sm:p-8 space-y-6">

        <!-- Portal Header -->
        <div class="text-center space-y-3">
          <div class="flex items-center justify-center gap-3">
            <img src="assets/images/psc_logo.png" alt="Portal Logo" class="h-11 w-auto max-w-[120px] object-contain">
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-[#0B3B24] tracking-tight mt-0.5">Recruitment Portal</h1>
            <p class="text-xs text-slate-500 mt-1">Online Recruitment &amp; Selection Portal</p>
          </div>
        </div>

        <!-- Notification / Error Banner (Hidden by default) -->
        <div id="login-alert" class="hidden p-3 rounded-lg text-xs font-semibold"></div>

        <!-- Simple Sign In Form -->
        <form id="login-form" onsubmit="handleSignIn(event)" class="space-y-4">
          
          <!-- Username / Email -->
          <div class="space-y-1.5">
            <label for="login-id" class="block text-xs font-bold text-slate-700">
              Username or Email
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="user" class="w-4 h-4"></i>
              </div>
              <input 
                type="text" 
                id="login-id" 
                name="nationalId" 
                required 
                placeholder="Enter username or email"
                value="candidate@demo.local"
                class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 focus:bg-white border border-slate-300 focus:border-[#0B3B24] focus:ring-2 focus:ring-[#0B3B24]/10 rounded-xl text-slate-900 text-sm font-medium transition outline-none"
              >
            </div>
          </div>

          <!-- Password -->
          <div class="space-y-1.5">
            <label for="login-password" class="block text-xs font-bold text-slate-700">
              Password
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </div>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                required 
                placeholder="Enter your password"
                value="••••••••••••"
                class="w-full pl-10 pr-10 py-2.5 bg-slate-50 focus:bg-white border border-slate-300 focus:border-[#0B3B24] focus:ring-2 focus:ring-[#0B3B24]/10 rounded-xl text-slate-900 text-sm font-medium transition outline-none"
              >
              <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600" aria-label="Toggle password visibility">
                <i data-lucide="eye" id="toggle-pwd-icon" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="flex items-center text-xs pt-0.5">
            <label class="flex items-center space-x-2 cursor-pointer text-slate-600">
              <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded border-slate-300 text-[#0B3B24] focus:ring-0">
              <span>Remember me on this device</span>
            </label>
          </div>

          <!-- Sign In Button -->
          <button 
            type="submit" 
            id="btn-submit"
            class="w-full py-3 px-4 bg-[#0B3B24] hover:bg-[#072517] text-white font-bold text-sm rounded-xl shadow-sm transition transform active:scale-[0.99] flex items-center justify-center space-x-2 cursor-pointer"
          >
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>Sign In</span>
          </button>
        </form>

      </div>

    </div>
  </main>

  <!-- Sign In Handler Script -->
  <script>
    // Initialize icons
    if (window.lucide) window.lucide.createIcons();

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('toggle-pwd-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) window.lucide.createIcons();
    }

    async function handleSignIn(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const idInput = document.getElementById('login-id');
      const id = idInput.value.trim() || 'demo-candidate';

      btn.disabled = true;
      btn.innerHTML = '<span class="inline-block animate-spin mr-2">⟳</span> Signing In...';

      let token = 'DEMO-SECURE-SESSION-TOKEN-' + Math.random().toString(36).substring(2, 10);
      try {
        const host = (window.location && window.location.hostname) ? window.location.hostname : 'localhost';
        const res = await fetch(`http://${host}:5000/api/v2/auth/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nationalId: id })
        });
        if (res.ok) {
          const authData = await res.json();
          token = authData.accessToken || token;
        }
      } catch (err) {
        // Fallback for offline/live-server direct usage
      }

      // Store authenticated session
      sessionStorage.setItem('psc_auth_token', token);
      sessionStorage.setItem('psc_candidate_id', id);
      sessionStorage.setItem('psc_candidate_name', 'Faith Mwangi');
      sessionStorage.setItem('psc_session_active', 'true');

      btn.className = "w-full py-3 px-4 bg-emerald-700 text-white font-bold text-sm rounded-xl flex items-center justify-center space-x-2";
      btn.innerHTML = '<span>✓ Authenticated! Opening Portal...</span>';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    }
  </script>
</body>
</html>
