services:
  psc-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psc-portal-production
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=*
      - KMS_KEY_ID=arn:aws:kms:af-south-1:psc-hsm-01
      - RATE_LIMIT_MAX=100
      - DB_POOL_MAX=20
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/healthz/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
